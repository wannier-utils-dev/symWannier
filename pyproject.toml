[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symWannier"
version = "1.1.0"
description = "A python package for computing symmetry adapted Wannier functions with irreducible BZ"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
{name = "Takashi Koretsune", email = "koretsune@cmpt.phys.tohoku.ac.jp"}
]
license = "GPL-2.0-only"
dependencies = [
	"requests",
	"numpy",
	"scipy",
]

[project.optional-dependencies]
dev = [
	"build",
	"pytest",
	"twine",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["symwannier"]

[tool.pytest.ini_options]
markers = [
	"slow: long-running regression tests for large workflow cases",
]

[project.scripts]
symwannier = "symwannier.cli:main"
